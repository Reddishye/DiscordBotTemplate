# Written as config.yml on first start. config.yml is gitignored.
# Each comment names the environment variable that overrides that value.
# A blank variable does not override. The file is not rewritten.

bot:
  # Discord bot token. Environment: BOT_TOKEN.
  token: change-me
  # Gateway intent names, one per line. Environment: BOT_INTENTS, as a comma-separated list.
  intents:
    - GUILD_MESSAGES
    - GUILD_MESSAGE_REACTIONS
    - DIRECT_MESSAGES
  # Status text. Empty shows no status. Environment: BOT_STATUS.
  status: ''
  # Reconnect after the gateway drops. Environment: BOT_AUTO_RECONNECT.
  autoReconnect: true
  # Gateway shards to open. 1 is a single process. Environment: BOT_SHARDS.
  shards: 1

database:
  # SQLITE, MARIADB or H2. Environment: BOT_DATABASE_TYPE.
  type: SQLITE
  # MariaDB hostname. Unused for SQLITE and H2. Environment: BOT_DATABASE_HOST.
  host: localhost
  # MariaDB port. Unused for SQLITE and H2. Environment: BOT_DATABASE_PORT.
  port: 3306
  # Database name. Environment: BOT_DATABASE_NAME.
  name: redactado
  # MariaDB user. Unused for SQLITE and H2. Environment: BOT_DATABASE_USER.
  user: root
  # MariaDB password. Environment: BOT_DATABASE_PASSWORD.
  password: ''
  # Folder for the SQLITE or H2 file. Environment: BOT_DATABASE_PATH.
  path: ./database

pool:
  # Connections kept idle. SQLITE always runs with 1. Environment: BOT_POOL_MIN_IDLE.
  minIdle: 1
  # Maximum open connections. SQLITE always runs with 1. Environment: BOT_POOL_MAX_SIZE.
  maxSize: 10
  # Milliseconds before an idle connection is closed. Environment: BOT_POOL_IDLE_TIMEOUT_MILLIS.
  idleTimeoutMillis: 30000
  # Milliseconds before a connection is retired. Environment: BOT_POOL_MAX_LIFETIME_MILLIS.
  maxLifetimeMillis: 1800000
  # Milliseconds to wait for a connection. Environment: BOT_POOL_CONNECTION_TIMEOUT_MILLIS.
  connectionTimeoutMillis: 30000
  # Milliseconds a borrowed connection may be held before a warning. Environment: BOT_POOL_LEAK_DETECTION_MILLIS.
  leakDetectionMillis: 60000

hibernate:
  # Log SQL. Environment: BOT_HIBERNATE_SHOW_SQL.
  showSql: false
  # Indent logged SQL. Environment: BOT_HIBERNATE_FORMAT_SQL.
  formatSql: false
  # Color logged SQL. Environment: BOT_HIBERNATE_HIGHLIGHT_SQL.
  highlightSql: false
  # Rows per JDBC batch. Environment: BOT_HIBERNATE_BATCH_SIZE.
  batchSize: 50
  # VALIDATE runs the SQL files, then checks the tables. UPDATE skips the SQL files and lets Hibernate change the database. Environment: BOT_HIBERNATE_SCHEMA.
  schema: VALIDATE

menu:
  # Folder of JSON preset files. Environment: BOT_MENU_PRESETS_DIRECTORY.
  presetsDirectory: presets
  # Maximum menu sessions kept in memory. Environment: BOT_MENU_SESSION_MAX_SIZE.
  sessionMaxSize: 50000
  # How long an idle session is kept: 30m, 90s, 2h, 500ms, or a number of minutes. Environment: BOT_MENU_SESSION_IDLE_TTL.
  sessionIdleTtl: 30m
  # Allow a user preset to override the guild preset. Environment: BOT_MENU_USER_PRESETS_ENABLED.
  userPresetsEnabled: false
  # Preset id used when nobody has chosen one. Environment: BOT_MENU_DEFAULT_PRESET.
  defaultPreset: default
  # Menu handlers allowed to run at the same time. 0 does not limit them. Environment: BOT_MENU_MAX_IN_FLIGHT.
  maxInFlight: 0

commands:
  # GUILD registers commands on one server. GLOBAL registers them for every server. Environment: BOT_COMMANDS_SCOPE.
  scope: GUILD
  # Server id used when scope is GUILD. 0 registers nothing and logs that. Environment: BOT_COMMANDS_GUILD_ID.
  guildId: 0
  # Cooldown used by commands that do not set their own. 0s means no cooldown. Environment: BOT_COMMANDS_DEFAULT_COOLDOWN.
  defaultCooldown: 0s

sentry:
  # Send errors to Sentry. Environment: BOT_SENTRY_ENABLED.
  enabled: false
  # Sentry DSN. Environment: BOT_SENTRY_DSN.
  dsn: ''
